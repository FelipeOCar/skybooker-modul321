name: SkyBooker CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore SkyBooker.sln --locked-mode
      - run: dotnet test SkyBooker.sln -c Release --no-restore --logger "trx;LogFileName=SkyBooker.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable test credentials
        shell: pwsh
        run: ./scripts/Setup.ps1
      - run: docker compose up --build -d --wait --wait-timeout 300
      - name: Test APIs against MongoDB, SQL Server and SQLite
        run: python3 scripts/smoke.py
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=80
      - name: Stop test environment
        if: always()
        run: docker compose down -v
